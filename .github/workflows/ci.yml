# Revisión automática en cada push y pull request: si algo se rompe, GitHub lo marca en rojo.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Dominio de prueba solo para compilar en CI (el real va en Dokploy / .env.production)
      NEXT_PUBLIC_SITE_URL: https://ci.example.com
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      - name: Compilar sitio estático
        run: npm run build

      - name: Instalar navegador para los tests
        run: npx playwright install --with-deps chromium

      - name: Tests de punta a punta
        run: npm run test:e2e

      - name: Guardar reporte si fallan
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-playwright
          path: playwright-report/
          retention-days: 7
