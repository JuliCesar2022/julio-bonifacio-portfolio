server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Redirecciones relativas: detrás del proxy de Dokploy (https) no se cambian a http
  absolute_redirect off;

  # Texto comprimido: la página carga más rápido
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

  # Archivos de Next con huella en el nombre: nunca cambian, el navegador los guarda un año
  location ^~ /_next/static/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Imágenes, videos y fuentes de /public
  location ~* \.(webp|png|jpg|jpeg|svg|ico|mp4|woff2)$ {
    expires 7d;
    add_header Cache-Control "public";
  }

  # Direcciones del sitio anterior (historia.html) -> nuevas (/historia), sin perder posicionamiento
  location ~ ^/(historia|proyectos)\.html$ {
    return 301 /$1$is_args$args;
  }

  # /historia -> historia.html
  location / {
    try_files $uri $uri.html $uri/ =404;
  }

  error_page 404 /404.html;
}
